[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "booktracker"
version = "0.20.0"
description = "Local-first reading history tracker for books, fanfiction and serialized web novels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.6,<6.9", "platformdirs>=4.0", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
booktracker = "booktracker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["booktracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# UI entry points deliberately convert unexpected errors into visible dialogs.
ignore = ["BLE001", "TRY004"]
