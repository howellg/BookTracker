name: Tests
on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check booktracker tests
      - name: Test database and import/export
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Compile all modules
        run: python -m compileall -q booktracker
      - name: Smoke test Qt without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PySide6.QtWidgets import QApplication
          from booktracker.database import Library
          from booktracker.gui import MainWindow
          with TemporaryDirectory() as path:
              app = QApplication([])
              window = MainWindow(Library(Path(path) / "test.sqlite3"))
              assert window.windowTitle().startswith("BookTracker")
              window.close()
          PY
