name: Tests
on:
  push:
    branches: [main, feature/**]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check booktracker tests
      - name: Test database and import/export
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Exercise disposable local self-test
        run: python -m booktracker --self-test
      - name: Compile all modules
        run: python -m compileall -q booktracker
      - name: Smoke test Qt without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PySide6.QtWidgets import QApplication
          from booktracker.database import Library
          from booktracker.gui import MainWindow
          with TemporaryDirectory() as path:
              app = QApplication([])
              window = MainWindow(Library(Path(path) / "test.sqlite3"))
              assert window.windowTitle().startswith("BookTracker")
              assert window.help_menu.title() == "&Help"
              window.close()
          PY

  package:
    name: Validate release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Validate package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          wheel, = Path("dist").glob("booktracker-*.whl")
          sdist, = Path("dist").glob("booktracker-*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert "booktracker/__main__.py" in names
              assert "booktracker/maintenance.py" in names
              assert "booktracker/database.py" in names
              assert any(name.endswith(".dist-info/METADATA") for name in names)
              assert not any("/__pycache__/" in name or name.endswith(".sqlite3")
                             for name in names)
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              assert any(name.endswith("/README.md") for name in names)
              assert any(name.endswith("/CHANGELOG.md") for name in names)
              assert any(name.endswith("/docs/RECOVERY.md") for name in names)
              assert any(name.endswith("/docs/RELEASE_CHECKLIST.md") for name in names)
              assert any(name.endswith("/booktracker/__main__.py") for name in names)
              assert not any("/.venv/" in name or name.endswith(".sqlite3")
                             for name in names)
          print("Wheel and source archive contents validated.")
          PY
      - name: Install built wheel and run release CLI
        run: |
          python -m venv /tmp/booktracker-wheel-smoke
          /tmp/booktracker-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/booktracker-wheel-smoke/bin/python -m booktracker --version
          /tmp/booktracker-wheel-smoke/bin/python -c 'import booktracker; assert "/site-packages/" in booktracker.__file__; print(booktracker.__file__)'
      - uses: actions/upload-artifact@v4
        with:
          name: booktracker-release-packages
          path: dist/*
          if-no-files-found: error
